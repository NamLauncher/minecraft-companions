# Author/creator: nattapat2871 (https://nattapat2871.me)
name: Verify Minecraft companions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Capture Java 17
        shell: pwsh
        run: '"NAMLAUNCHER_JAVA17_HOME=$env:JAVA_HOME" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Capture Java 21
        shell: pwsh
        run: '"NAMLAUNCHER_JAVA21_HOME=$env:JAVA_HOME" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Capture Java 25 and install pinned Gradle 8.8
        shell: pwsh
        run: |
          "NAMLAUNCHER_JAVA25_HOME=$env:JAVA_HOME" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $toolRoot = Join-Path $env:RUNNER_TEMP 'namlauncher-gradle-8.8'
          $archive = Join-Path $toolRoot 'gradle-8.8-bin.zip'
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          Invoke-WebRequest -Uri 'https://services.gradle.org/distributions/gradle-8.8-bin.zip' -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'a4b4158601f8636cdeeab09bd76afb640030bb5b144aafe261a5e8af027dc612') {
            throw "Gradle 8.8 checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot -Force
          "NAMLAUNCHER_GRADLE8_HOME=$(Join-Path $toolRoot 'gradle-8.8')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm test
      - run: npm run build:bundle
