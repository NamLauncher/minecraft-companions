// Author/creator: nattapat2871 (https://nattapat2871.me)
plugins { id 'fabric-loom' version '1.16.3' }

version = '1.2.4-beta3+1.21.11'
group = 'com.namlauncher'
base { archivesName = 'namlauncher-game-companion-fabric-1.21.11' }

tasks.named('compileJava') {
    source fileTree('../../game-bridge/src/main/java') {
        exclude '**/BrandingConstants.java'
        exclude '**/BrandingFormatter.java'
    }
    source fileTree('../../game-bridge/src/client/java') {
        exclude '**/badge/BadgeComponents.java'
        exclude '**/badge/NamLauncherChatOutput.java'
        exclude '**/mixin/ChatListenerMixin.java'
        exclude '**/mixin/ChatComponentBadgeMixin.java'
        exclude '**/mixin/DebugEntryVersionMixin.java'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.3'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
    from('../../assets/NamLauncher-icon.png') {
        into 'assets/namlauncher/textures/font'
        rename { 'badge.png' }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
java { withSourcesJar() }
tasks.named('test') { useJUnitPlatform() }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }

// Private icon entry is not addressable through Minecraft resource packs.
processResources {
    from('../../assets/NamLauncher-icon.png') { into 'namlauncher-internal'; rename { 'badge.png' } }
}
